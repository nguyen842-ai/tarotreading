<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Lắng Nghe Vũ Trụ © 2026 All Rights Reserved - developed by Nguyen842</title>
    <link rel="icon" type="image/png" href="favicon.PNG">
    
    <!-- TÍCH HỢP THƯ VIỆN ANIMATE.CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        /* ================= BẢNG MÀU PANTONE TÍM ================= */
        :root {
            --p1: #4c00b0;
            --p2: #7600bc;
            --p3: #8a00c2;
            --p4: #a000c8;
            --p5: #b100cd;
            --p6: #be2ed6;
            --p7: #ca5cdd;
            --p8: #da8ee7;
            --p9: #e8bcf0;
            
            --bg-main: #090a0f; 
            --bg-panel: rgba(76, 0, 176, 0.4);
            --text-main: var(--p9);
            --accent-gold: var(--p6);
            --accent-gold-hover: var(--p8); 
            --text-muted: var(--p7);
            --border-color: rgba(138, 0, 194, 0.5);
        }

        /* ================= RESET & CƠ BẢN ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-main); color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px 25px; min-height: 100vh; overflow-x: hidden; -webkit-text-size-adjust: 100%;
            display: flex; flex-direction: column;
        }

        /* ================= BACKGROUND BÀN TRẢI BÀI ================= */
        .bg-universe {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(ellipse at bottom, var(--p1) 0%, #090a0f 100%);
            overflow: hidden;
        }
        @keyframes animStar { from { transform: translateY(0px); } to { transform: translateY(-2000px); } }
        #stars, #stars2, #stars3 { background: transparent; position: absolute; }
        #stars { width: 1px; height: 1px; box-shadow: 100px 200px #fff, 300px 400px #fff, 500px 600px #fff, 800px 900px #fff, 1200px 1500px #fff, 1800px 1900px #fff, 450px 120px #fff, 900px 800px #fff, 1400px 300px #fff, 200px 1800px #fff, 1600px 1100px #fff, 750px 1600px #fff; animation: animStar 50s linear infinite; }
        #stars:after { content: " "; position: absolute; top: 2000px; width: 1px; height: 1px; box-shadow: inherit; }
        #stars2 { width: 2px; height: 2px; box-shadow: 150px 250px #fff, 350px 450px #fff, 550px 650px #fff, 850px 950px #fff, 1250px 1550px #fff, 250px 850px #fff, 650px 1350px #fff, 1050px 250px #fff, 1450px 1750px #fff, 1750px 550px #fff; animation: animStar 100s linear infinite; }
        #stars2:after { content: " "; position: absolute; top: 2000px; width: 2px; height: 2px; box-shadow: inherit; }
        #stars3 { width: 3px; height: 3px; box-shadow: 200px 300px #fff, 400px 500px #fff, 600px 700px #fff, 900px 1000px #fff, 100px 1300px #fff, 1300px 600px #fff, 1800px 1400px #fff, 700px 1900px #fff; animation: animStar 150s linear infinite; }
        #stars3:after { content: " "; position: absolute; top: 2000px; width: 3px; height: 3px; box-shadow: inherit; }

        /* ================= HEADER ĐỘNG ================= */
        #app-header { display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: 25px; } /* Tăng khoảng cách tổng */
        .title-tab-group { display: flex; flex-direction: column; align-items: center; width: 100%; }
        
        h1 { 
            margin-bottom: 20px; font-size: clamp(1.5rem, 3vw, 2.2rem); 
            text-shadow: 0 0 15px var(--accent-gold); line-height: 1.2; color: #fff; text-align: center;
        }
        
        /* Tăng margin-bottom để dãn khoảng cách với box điều khiển */
        .tabs-container { display: flex; gap: 15px; justify-content: center; margin-bottom: 25px; } 

        #app-header.intro-mode .controls-group { display: none; }
        #app-header.reading-mode .controls-group { display: block; width: 100%; max-width: 900px; }

        /* ================= NÚT GLITCH (ÁP DỤNG CHUNG) ================= */
        .glitch-btn, .glitch-btn::after {
            padding: 16px 30px; font-size: 18px; font-weight: bold; background: linear-gradient(45deg, transparent 5%, var(--p4) 5%);
            border: 0; color: #fff; letter-spacing: 3px; line-height: 1; box-shadow: 6px 0px 0px var(--p6); outline: transparent; position: relative; cursor: pointer;
            transition: all 0.3s ease;
        }
        .glitch-btn::after {
            --slice-0: inset(50% 50% 50% 50%); --slice-1: inset(80% -6px 0 0); --slice-2: inset(50% -6px 30% 0); --slice-3: inset(10% -6px 85% 0); --slice-4: inset(40% -6px 43% 0); --slice-5: inset(80% -6px 5% 0);
            content: attr(data-text); display: block; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(45deg, transparent 3%, var(--p6) 3%, var(--p6) 5%, var(--p3) 5%);
            text-shadow: -3px -3px 0px var(--p8), 3px 3px 0px var(--p2); clip-path: var(--slice-0);
        }
        .glitch-btn:hover::after { animation: 1s glitch-btn-anim; animation-timing-function: steps(2, end); }
        
        /* === Trạng thái Active cho Tab Buttons === */
        .glitch-btn.active::after {
            background: linear-gradient(45deg, transparent 3%, var(--p9) 3%, var(--p9) 5%, var(--p8) 5%);
            color: #000;
            text-shadow: none;
            box-shadow: 6px 0px 0px var(--p1);
        }
        /* Mất bóng đổ cũ khi active */
        .glitch-btn.active {
            box-shadow: 6px 0px 0px var(--p2);
        }

        @keyframes glitch-btn-anim {
            0% { clip-path: var(--slice-1); transform: translate(-20px, -10px); } 10% { clip-path: var(--slice-3); transform: translate(10px, 10px); }
            20% { clip-path: var(--slice-1); transform: translate(-10px, 10px); } 30% { clip-path: var(--slice-3); transform: translate(0px, 5px); }
            40% { clip-path: var(--slice-2); transform: translate(-5px, 0px); } 50% { clip-path: var(--slice-3); transform: translate(5px, 0px); }
            60% { clip-path: var(--slice-4); transform: translate(5px, 10px); } 70% { clip-path: var(--slice-2); transform: translate(-10px, 10px); }
            80% { clip-path: var(--slice-5); transform: translate(20px, -10px); } 90% { clip-path: var(--slice-1); transform: translate(-10px, 0px); }
            100% { clip-path: var(--slice-1); transform: translate(0); }
        }

        /* ================= BẢNG ĐIỀU KHIỂN BỐC BÀI ================= */
        .controls-inner {
            display: grid; grid-template-columns: 1fr 1fr; 
            grid-template-areas: "q q" "reader sys" "spread btns" "status status";
            gap: 12px; background: rgba(0, 0, 0, 0.5); padding: 14px 18px; border-radius: 12px;
            border: 1px solid var(--border-color); width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            animation-duration: 0.8s;
        }
        #user-question { grid-area: q; } #ui-reader-group { grid-area: reader; } #ui-style-group { grid-area: sys; }
        #spread-type { grid-area: spread; } .btn-group { grid-area: btns; display: flex; gap: 8px; }
        #status-message { grid-area: status; margin: 0; font-size: 0.85rem; font-style: italic; color: var(--text-muted); text-align: center; }

        input[type="text"], select {
            width: 100%; padding: 12px; font-size: 0.95rem; font-family: 'Courier New', monospace;
            color: var(--p7); background-color: #000; border: 2px solid var(--p5); border-radius: 0;
            outline: none; transition: all 0.3s ease; box-shadow: 4px 4px 0 var(--p4); -webkit-appearance: none; appearance: none;
        }
        input::placeholder { color: var(--p4); }
        input[type="text"]:hover, select:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--p3); }
        input[type="text"]:focus, select:focus { border-color: var(--p7); box-shadow: 4px 4px 0 var(--p6); color: var(--p9); animation: shake 0.5s ease-in-out; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25%, 75% { transform: translateX(-4px) rotate(-2deg); } 50% { transform: translateX(4px) rotate(2deg); } }
        @keyframes glitch { 0%, 10%, 27%, 35%, 50%, 72%, 80%, 100% { transform: none; opacity: 1; } 7% { transform: skew(-0.5deg, -0.9deg); opacity: 0.75; } 30% { transform: skew(0.8deg, -0.1deg); opacity: 0.75; } 55% { transform: skew(-1deg, 0.2deg); opacity: 0.75; } 75% { transform: skew(0.4deg, 1deg); opacity: 0.75; } }
        input[type="text"]:not(:placeholder-shown) { font-weight: bold; letter-spacing: 1px; animation: glitch 1.5s linear infinite; }

        .radio-wrapper { display: flex; gap: 4px; border: 2px solid var(--p4); border-radius: 10px; background: #000; padding: 4px; user-select: none; }
        .radio-label { flex: 1; display: flex; cursor: pointer; }
        .radio-input { display: none; }
        .radio-text { flex: 1; text-align: center; font-weight: bold; font-size: 0.85rem; color: var(--p6); padding: 8px; border-radius: 8px; transition: 0.2s ease-in-out; }
        .radio-input:checked + .radio-text { background: linear-gradient(to right, var(--p4), var(--p6)); color: white; box-shadow: 0 2px 10px rgba(138, 0, 194, 0.5); letter-spacing: 1px; }

        .mystic-btn {
            padding: 10px 12px; font-size: 0.85rem; font-weight: bold; color: #fff; font-family: 'Courier New', monospace;
            background-color: var(--p3); border: 3px solid #000; border-radius: 0;
            cursor: pointer; transition: all 0.2s; flex: 1; box-shadow: 4px 4px 0 var(--p1); white-space: nowrap;
        }
        .mystic-btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
        @media (hover: hover) { .mystic-btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--p2); background-color: var(--p4); } }
        .mystic-btn:disabled { background-color: #444; border-color: #222; color: #888; box-shadow: none; cursor: not-allowed; }

        /* ================= TABS NỘI DUNG ================= */
        .tab-content { width: 100%; margin: 0 auto; flex-grow: 1; display: none; }
        .tab-content.active { display: flex; flex-direction: column; }
        
        #intro-container { width: 100%; flex-grow: 1; display: flex; flex-direction: column; align-items: center; margin: 0 auto; }
        
        /* TEXT CHÀO MỪNG SANG TRỌNG NẰM TRÊN NỀN VŨ TRỤ */
        .elegant-welcome-title {
            font-size: clamp(1.6rem, 4vw, 2.5rem); font-weight: 300; letter-spacing: 3px; 
            text-transform: uppercase; color: var(--p9); text-shadow: 0 0 25px var(--p5); 
            text-align: center; margin-bottom: 15px; margin-top: 10px; line-height: 1.4;
        }
        .elegant-welcome-desc {
            font-size: 1.1rem; line-height: 1.8; color: #e2d1f9; max-width: 900px; 
            text-align: center; text-shadow: 0 2px 5px #000; margin-bottom: 40px;
        }

        #intro-dynamic-content { margin-top: 30px; width: 100%; display: none; }
        .intro-card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; text-align: left; box-shadow: 0 6px 15px rgba(0,0,0,0.5); backdrop-filter: blur(5px); width: 100%;}
        .intro-card h2 { color: var(--accent-gold); margin-bottom: 15px; font-size: 1.3rem; border-bottom: 1px dashed rgba(190, 46, 214, 0.4); padding-bottom: 8px; text-align: center;}
        .intro-card p { color: var(--text-main); line-height: 1.8; font-size: 0.95rem; }

        /* ================= BỐ CỤC TRẢI BÀI TỰ ĐỘNG GIÃN ================= */
        .app-layout { display: flex; gap: 20px; align-items: stretch; flex-grow: 1; width: 100%; }
        .panel-left { flex: 1 1 50%; display: flex; flex-direction: column; border-right: 1px solid rgba(138, 0, 194, 0.3); padding-right: 15px; }
        .panel-right { flex: 1 1 50%; display: flex; flex-direction: column; position: relative; }

        /* THẺ THÔNG TIN TRẢI BÀI (GLOWING CARD) */
        .info-card-wrap {
            width: 100%; max-width: 400px; min-height: 200px; background-image: linear-gradient(163deg, var(--p3) 0%, var(--p7) 100%);
            border-radius: 20px; transition: all .3s; padding: 3px; margin: 40px auto; animation-duration: 0.8s; 
        }
        .animate__hinge { animation-duration: 2s; transform-origin: top left; }
        .info-card-inner {
            width: 100%; height: 100%; min-height: 194px; background-color: #1a1a1a; border-radius: 17px; transition: all .2s; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 25px 20px; text-align: center; color: #ccc; font-size: 0.9rem; line-height: 1.5;
        }
        .info-card-inner:hover { transform: scale(0.98); border-radius: 17px; }
        .info-card-wrap:hover { box-shadow: 0px 0px 30px 1px rgba(190, 46, 214, 0.4); }
        .info-card-inner strong { color: var(--p8); font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; display: block; }
        .info-card-inner em { color: var(--p6); font-size: 0.95rem; font-weight: bold; margin-bottom: 12px; border-bottom: 1px dashed var(--p4); padding-bottom: 8px; display: inline-block; font-style: normal; }

        /* THIẾT KẾ LÁ BÀI & GRID */
        .tarot-board { display: flex; flex-wrap: wrap; justify-content: center; gap: 45px 12px; margin: 25px 0; width: 100%; }
        .tarot-board.classic_croix { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: auto auto auto; gap: 45px 15px; justify-items: center; align-items: center; }
        .classic_croix .card-slot:nth-child(1) { grid-area: 2 / 1; } .classic_croix .card-slot:nth-child(2) { grid-area: 2 / 3; } .classic_croix .card-slot:nth-child(3) { grid-area: 1 / 2; } .classic_croix .card-slot:nth-child(4) { grid-area: 3 / 2; } .classic_croix .card-slot:nth-child(5) { grid-area: 2 / 2; } 
        .tarot-board.classic_celtique { display: grid; grid-template-columns: 1fr 1.2fr 1fr 1fr; grid-template-rows: repeat(4, 1fr); gap: 40px 10px; justify-items: center; align-items: center; }
        .classic_celtique .card-slot:nth-child(1) { grid-area: 2 / 2 / 4 / 3; z-index: 1; margin-top: 20px;} .classic_celtique .card-slot:nth-child(2) { grid-area: 2 / 2 / 4 / 3; transform: rotate(90deg); z-index: 2; margin-top: 20px;} .classic_celtique .card-slot:nth-child(3) { grid-area: 1 / 2 / 2 / 3; } .classic_celtique .card-slot:nth-child(4) { grid-area: 4 / 2 / 5 / 3; } .classic_celtique .card-slot:nth-child(5) { grid-area: 2 / 1 / 4 / 2; } .classic_celtique .card-slot:nth-child(6) { grid-area: 2 / 3 / 4 / 4; } .classic_celtique .card-slot:nth-child(7) { grid-area: 4 / 4 / 5 / 5; } .classic_celtique .card-slot:nth-child(8) { grid-area: 3 / 4 / 4 / 5; } .classic_celtique .card-slot:nth-child(9) { grid-area: 2 / 4 / 3 / 5; } .classic_celtique .card-slot:nth-child(10) { grid-area: 1 / 4 / 2 / 5; }
        .tarot-board.mystic_tree { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: repeat(7, auto); gap: 45px 15px; justify-items: center; align-items: center; margin: 25px 0; width: 100%; }
        .mystic_tree .card-slot:nth-child(1) { grid-area: 1 / 2; } .mystic_tree .card-slot:nth-child(2) { grid-area: 2 / 3; } .mystic_tree .card-slot:nth-child(3) { grid-area: 2 / 1; } .mystic_tree .card-slot:nth-child(4) { grid-area: 3 / 3; } .mystic_tree .card-slot:nth-child(5) { grid-area: 3 / 1; } .mystic_tree .card-slot:nth-child(6) { grid-area: 4 / 2; } .mystic_tree .card-slot:nth-child(7) { grid-area: 5 / 3; } .mystic_tree .card-slot:nth-child(8) { grid-area: 5 / 1; } .mystic_tree .card-slot:nth-child(9) { grid-area: 6 / 2; } .mystic_tree .card-slot:nth-child(10) { grid-area: 7 / 2; }

        .card-slot { perspective: 1000px; width: clamp(65px, 9vw, 95px); height: clamp(113px, 15vw, 166px); cursor: pointer; position: relative; touch-action: manipulation; }
        .card-slot:not(.flipped):hover { transform: scale(1.05) rotate(-2deg); }
        .card-slot:not(.flipped):hover .card-inner { box-shadow: 0 0 20px var(--p6); }
        .card-label { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); width: 120%; min-width: 90px; white-space: normal; font-size: 0.65rem; color: var(--p9); font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; text-shadow: 0 0 5px #000, 0 0 10px var(--p4); text-align: center; line-height: 1.4; z-index: 10; opacity: 0; transition: 0.3s ease; pointer-events: none; }
        .card-slot:hover .card-label, .card-slot.flipped .card-label { opacity: 1; bottom: calc(100% + 15px); }
        .card-inner { width: 100%; height: 100%; position: relative; transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; border-radius: 8px;}
        .card-slot.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 8px; box-shadow: 0 8px 14px 0 rgba(0,0,0,0.4); border: 2px solid var(--p6); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .card-front { background: linear-gradient(120deg, var(--p1) 20%, var(--p3) 88%, var(--p2) 40%, var(--p5) 48%); }
        .card-back { transform: rotateY(180deg); background-color: #fff; border: 2px solid var(--p8); }
        .card-front img, .card-back img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; pointer-events: none; }
        .card-slot .card-inner .card-back img.card-reversed { transform: rotate(180deg); }

        /* VÙNG HIỂN THỊ KẾT QUẢ */
        .loading-dots::after { content: ''; animation: dots 1.4s infinite; }
        @keyframes dots { 0% {content:'';} 25% {content:'.';} 50% {content:'..';} 75% {content:'...';} }

        .reading-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; color: var(--p4); font-size: 0.9rem; font-style: italic; gap: 10px; padding: 20px; min-height: 200px; }
        .placeholder-icon { font-size: 2.5rem; opacity: 0.4; }
        #reading-result { background: var(--bg-panel); border: 1px solid var(--p5); padding: 16px; border-radius: 10px; text-align: left; line-height: 1.7; font-size: 0.9rem; display: none; box-shadow: 0 0 20px rgba(138,0,194,0.2); flex: 1; overflow-y: auto; max-height: calc(100vh - 160px); backdrop-filter: blur(5px); }
        .copy-btn-wrap { display: flex; justify-content: flex-end; margin-top: 15px; padding-top: 10px; border-top: 1px dashed var(--p4); }
        #btn-copy { display: flex; align-items: center; gap: 4px; padding: 6px 12px; font-size: 0.8rem; font-weight: bold; color: #fff; background: var(--p3); border: 2px solid #000; border-radius: 0; cursor: pointer; transition: 0.2s; box-shadow: 2px 2px 0 #000;}
        #btn-copy:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
        #btn-copy.copied { background-color: var(--p6); color: #000; }
        #reading-result::-webkit-scrollbar { width: 4px; }
        #reading-result::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        #reading-result::-webkit-scrollbar-thumb { background: var(--p5); border-radius: 4px; }

        #chat-followup-container { display: none; margin-top: 20px; border-top: 1px dashed var(--p4); padding-top: 18px; }
        #chat-history { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .chat-bubble-user { background: rgba(0, 0, 0, 0.6); padding: 12px 14px; border-radius: 10px; border-left: 3px solid var(--p6); font-size: 0.9rem; line-height: 1.6; }
        .chat-bubble-ai { background: rgba(190, 46, 214, 0.15); padding: 14px; border-radius: 10px; border-left: 3px solid var(--p8); font-size: 0.9rem; line-height: 1.7; }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 992px) {
            .controls-inner { grid-template-areas: "q" "reader" "sys" "spread" "btns" "status" !important; grid-template-columns: 1fr !important; padding: 12px; }
            .btn-group { width: 100% !important; }
            .app-layout { flex-direction: column; }
            .panel-left, .panel-right { max-width: 100%; border: none; padding-right: 0;}
        }
        @media (max-width: 768px) {
            .tarot-board.classic_croix, .tarot-board.classic_celtique, .tarot-board.mystic_tree { display: flex !important; flex-wrap: wrap !important; justify-content: center !important; gap: 52px 16px !important; padding-top: 15px; }
            .classic_celtique .card-slot:nth-child(2) { transform: none !important; margin-top: 0 !important; }
            .radio-wrapper { flex-direction: column; }
            .glitch-btn { padding: 12px 20px; font-size: 14px; }
            .elegant-welcome-title { font-size: 1.8rem; }
            .tabs-container { flex-direction: row; flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    
    <div class="bg-universe">
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>
    </div>

    <!-- HEADER -->
    <header id="app-header" class="intro-mode">
        <div class="title-tab-group">
            <h1 id="main-title" class="animate__animated animate__fadeInDown">🔮 Trạm Lắng Nghe Vũ Trụ 🔮</h1>
            
            <div class="tabs-container">
                <button class="glitch-btn tab-btn active" onclick="switchTab('tab-intro')" data-text="GIỚI THIỆU">GIỚI THIỆU</button>
                <button class="glitch-btn tab-btn" onclick="switchTab('tab-reading')" data-text="BỐC BÀI">BỐC BÀI</button>
            </div>
        </div>
        
        <div class="controls-group" id="controls-group">
            <div class="controls-inner" id="controls-inner-box">
                <input type="text" id="user-question" placeholder="Nhập điều bạn băn khoăn vào đây...">
                
                <div class="radio-wrapper" id="ui-reader-group">
                    <label class="radio-label"><input type="radio" name="ui-reader" value="amelia" checked class="radio-input"><span class="radio-text">Amelia</span></label>

    <script>

        function switchTab(tabId) {
            const currentActive = document.querySelector('.tab-content.active') || document.querySelector('.tab-content[style*="display: block"]') || document.getElementById('tab-intro');
            const nextActive = document.getElementById(tabId);
            const header = document.getElementById('app-header');
            const mainTitle = document.getElementById('main-title');
            const controlsInner = document.getElementById('controls-inner-box');
            
            if (currentActive === nextActive) return;

            if (tabId === 'tab-reading') {
                header.classList.remove('intro-mode');
                header.classList.add('reading-mode');
                
                // Đồng bộ tiêu đề không thay đổi nội dung/kích thước, chỉ reset animation
                mainTitle.classList.remove('animate__fadeInDown');
                void mainTitle.offsetWidth; 
                mainTitle.classList.add('animate__fadeInDown');
                
                controlsInner.classList.remove('animate__fadeInTopRight');
                void controlsInner.offsetWidth; 
                controlsInner.classList.add('animate__animated', 'animate__fadeInTopRight');
            } else {
                header.classList.remove('reading-mode');
                header.classList.add('intro-mode');
                
                mainTitle.classList.remove('animate__fadeInDown');
                void mainTitle.offsetWidth; 
                mainTitle.classList.add('animate__fadeInDown');
            }

            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.getAttribute('onclick').includes(tabId)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            currentActive.style.display = 'none';
            currentActive.classList.remove('active');
            
            nextActive.style.display = 'flex';
            nextActive.classList.add('active');
        }

        let dynamicIntroData = []; 
        let isAnimatingIntro = false;

        async function fetchIntroData() {
            const loadingDiv = document.getElementById('loading-intro');
            const apiUrl = 'https://tarotreading-eight.vercel.app/api/sheets';

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.valueRanges && data.valueRanges.length > 0) {
                    loadingDiv.style.display = 'none';

                    let welcomeTitleRaw = data.valueRanges[0].values[0][0] || "Trạm Lắng Nghe";
                    let welcomeDescRaw = data.valueRanges[0].values[1][0] || "";
                    
                    const emojiRegex = /([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g;
                    
                    let cleanTitle = welcomeTitleRaw.replace(emojiRegex, '').trim();
                    // Xuống dòng cụm TRẠM LẮNG NGHE VŨ TRỤ
                    cleanTitle = cleanTitle.replace(/(TRẠM LẮNG NGHE VŨ TRỤ)/i, "<br>$1");
                    document.getElementById('welcome-card-title').innerHTML = cleanTitle;
                    
                    document.getElementById('welcome-card-desc').innerHTML = welcomeDescRaw.replace(emojiRegex, '').trim().replace(/\n/g, '<br>');

                    for(let i=1; i<=3; i++) {
                        if(data.valueRanges[i]) {
                            let title = data.valueRanges[i].values[0][0];
                            let desc = data.valueRanges[i].values[1][0].replace(/\n/g, '<br>');
                            let btnHtml = `<button class="mystic-btn btn-jump" style="margin-top: 20px; width: auto; padding: 15px 30px;" onclick="switchTab('tab-reading')">Bốc Bài Ngay</button>`;
                            
                            dynamicIntroData.push(`
                                <div class="intro-card" style="animation:none; transform:none; opacity:1;">
                                    <h2>${title}</h2>
                                    <p>${desc}</p>
                                    <div style="text-align:center;">${btnHtml}</div>
                                </div>
                            `);
                        }
                    }
                    
                    document.getElementById('welcome-section').style.display = 'flex';
                }
            } catch (error) {
                loadingDiv.innerHTML = "📡 Mất kết nối đến Trạm. Vui lòng thử lại sau!";
            }
        }

        function showIntroContent(index) {
            const container = document.getElementById('intro-dynamic-content');
            if (isAnimatingIntro || !dynamicIntroData[index]) return;

            if (container.style.display === 'none' || container.innerHTML.trim() === '') {
                container.innerHTML = dynamicIntroData[index];
                container.style.display = 'block';
                container.className = 'animate__animated animate__slideInUp';
            } else {
                isAnimatingIntro = true;
                container.className = 'animate__animated animate__rotateOut';
                
                container.onanimationend = () => {
                    container.innerHTML = dynamicIntroData[index];
                    container.className = 'animate__animated animate__slideInUp';
                    isAnimatingIntro = false;
                    container.onanimationend = null; 
                };
            }
        }

        let currentTarotDeck = [], currentLenormandDeck = [], currentChakraDeck = [];

        let isProcessing = false, cooldownTimer = null;

        const btnShuffle = document.getElementById("btn-shuffle");

        const modernSpreadsHTML = `
            <option value="intent_all">TOÀN DIỆN (What, Why, How, When, Who?)</option>
            <option value="intent_what">WHAT / YES-NO</option>
            <option value="intent_why">WHY / HOW (Gốc rễ, nhân quả)</option>

        `;

        function updateSpreadOptions() {
            if (readingStyleSelect.value === "modern") spreadSelect.innerHTML = modernSpreadsHTML;
            else if (readingStyleSelect.value === "classical") spreadSelect.innerHTML = classicalSpreadsHTML;
            else if (readingStyleSelect.value === "mystic") spreadSelect.innerHTML = mysticSpreadsHTML;
            
            resetBoardState();
        }

        function resetBoardState() {
            if (isProcessing) return; 
            btnDraw.disabled = true;
            board.className = "tarot-board"; 
            
            const spreadHTML = SPREAD_DESCRIPTIONS[spreadSelect.value] || "<strong>✨ Sẵn sàng kết nối</strong><br><em>Chọn trải bài</em><br>Nhấn 'Xào Bài' để khởi động trường năng lượng.";

            board.innerHTML = `
                <div class="info-card-wrap animate__animated animate__fadeInLeft">
                    <div class="info-card-inner">
                        ${spreadHTML}
                    </div>
                </div>
            `;
            
            hideReading();
            statusMsg.innerText = "Cấu trúc đã thay đổi. Hãy xào bài lại!";
        }

        readingStyleSelect.addEventListener("change", updateSpreadOptions);
        spreadSelect.addEventListener("change", resetBoardState);
        
        readerSelect.addEventListener("change", () => {
            if (flippedCount === totalCardsToDraw && totalCardsToDraw > 0 && !isProcessing) {
                const selectedOptionText = readerSelect.options[readerSelect.selectedIndex].text.split(" (")[0];
                statusMsg.innerText = `🔮 ${selectedOptionText} đang luận giải lại tụ bài này cho bạn...`;
                getFullTarotReading(); 
            } else if (!btnDraw.disabled) {
                statusMsg.innerText = "Đã thay đổi Reader. Hãy ấn Bốc Bài!";
            }
        });

        function showReading() {
            readingBox.style.display = "flex";
            readingBox.style.flexDirection = "column";
            if (readingPlaceholder) readingPlaceholder.style.display = "none";
        }

        function hideReading() {
            readingBox.style.display = "none";
            if (readingPlaceholder) readingPlaceholder.style.display = "flex";
            chatContainer.style.display = "none";
            chatHistory.innerHTML = "";
            currentSessionContext = "";
        }

        btnCopy.addEventListener("click", () => {
            const text = readingContent.innerText || readingContent.textContent;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                btnCopy.classList.add("copied");
                document.getElementById("copy-label").textContent = "Đã copy!";
                setTimeout(() => {
                    btnCopy.classList.remove("copied");
                    document.getElementById("copy-label").textContent = "Sao chép";
                }, 2000);
            });
        });

        function startCooldown(seconds) {
            let timeLeft = seconds;
            btnShuffle.disabled = true; 
            if (cooldownTimer) clearInterval(cooldownTimer); 

            cooldownTimer = setInterval(() => {
                btnShuffle.textContent = `⏳ Tĩnh tâm (${timeLeft}s)`;
                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(cooldownTimer);
                    btnShuffle.textContent = "🔀 Xào Bài";
                    btnShuffle.disabled = false; 
                    statusMsg.innerText = "Sẵn sàng! Bạn có thể đặt câu hỏi mới.";
                }
            }, 1000);
        }

        async function getFullTarotReading() {
            if (isProcessing) return;
            const question = document.getElementById("user-question").value.trim() || "Vũ trụ muốn gửi gắm thông điệp gì cho mình?";
            const spreadMode = spreadSelect.value;
            const selectedReader = readerSelect.value;
            const readerInfo = READER_PERSONAS[selectedReader] || READER_PERSONAS["amelia"];
            
            showReading();
            isProcessing = true;
            btnShuffle.disabled = true; 
            readingContent.innerHTML = `🔮 <span class="loading-dots">Đang giải mã tín hiệu</span>`;
            chatContainer.style.display = "none";
            chatHistory.innerHTML = "";

            const promptText = buildMainReadingPrompt(selectedReader, question, spreadMode, drawnCardsList);
            const apiUrl = "https://tarotreading-eight.vercel.app/api/gemini";

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    const isQuotaError = response.status === 429 || (data.error.status === "RESOURCE_EXHAUSTED");
                    if (isQuotaError) {
                        readingContent.innerHTML = `🌙 Các vì sao đang nghỉ ngơi! Năng lượng đang nạp lại, bạn đợi 1 phút rồi thử bốc lại nhé! 💖`;
                    } else {
                        readingContent.innerHTML = `🌠 Tín hiệu chập chờn! Hãy thử xào bài và bốc lại nhé! ✨`;
                    }
                } else {
                    let aiResponse = data.candidates[0].content.parts[0].text;
                    aiResponse = aiResponse.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>'); 
                    aiResponse = aiResponse.replace(/\n/g, '<br>'); 
                    
                    readingContent.innerHTML = `${readerInfo.displayName}<br><br>${aiResponse}`;

                    currentSessionContext = `
                    [NGỮ CẢNH TỤ BÀI ĐÃ BỐC]
                    - Reader đang tư vấn: ${readerInfo.title}
                    - Câu hỏi gốc: "${question}"
                    - Các lá bài: ${drawnCardsList.map(c => c.name + (c.reversed ? ' (ngược)' : '')).join(", ")}
                    - Lời luận giải trước đó: "${aiResponse}"
                    `;
                    chatContainer.style.display = "block";
                }
            } catch (error) {
                readingContent.innerHTML = "📡 Mất kết nối! Bạn kiểm tra mạng rồi thử lại nha! 🧚‍♀️";
            } finally {
                isProcessing = false;
                startCooldown(15);
            }
        }

        async function sendFollowupQuestion() {
            const userMsg = followupInput.value.trim();
            if (!userMsg || isProcessing) return;

            const selectedReader = readerSelect.value;
            const readerInfo = READER_PERSONAS[selectedReader] || READER_PERSONAS["amelia"];

            chatHistory.innerHTML += `
                <div class="chat-bubble-user">
                    <b>👤 Bạn:</b> ${userMsg}
                </div>
                <div id="ai-typing" style="color: var(--text-muted); font-style: italic; padding: 4px; font-size: 0.85rem;">
                    🔮 ${readerInfo.title} đang lắng nghe và suy ngẫm...
                </div>
            `;

            followupInput.value = "";
            isProcessing = true;
            btnFollowupSend.disabled = true;

            const followUpPrompt = buildFollowupPrompt(selectedReader, currentSessionContext, userMsg);

            try {
                const response = await fetch("https://tarotreading-eight.vercel.app/api/gemini", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: followUpPrompt })
                });
                const data = await response.json();
                
                const typingEl = document.getElementById("ai-typing");
                if (typingEl) typingEl.remove();

                if (data.error) {
                    chatHistory.innerHTML += `<div style="color: #f87171; font-size: 0.85rem;">📡 Mất tín hiệu trả lời, bạn thử gửi lại nhé!</div>`;
                } else {
                    let aiMsg = data.candidates[0].content.parts[0].text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                    chatHistory.innerHTML += `
                        <div class="chat-bubble-ai">
                            <b>${readerInfo.title}:</b><br>${aiMsg}
                        </div>
                    `;
                }
            } catch (err) {
                const typingEl = document.getElementById("ai-typing");
                if (typingEl) typingEl.remove();
                chatHistory.innerHTML += `<div style="color: #f87171; font-size: 0.85rem;">📡 Lỗi kết nối, vui lòng kiểm tra mạng!</div>`;
            } finally {
                isProcessing = false;
                btnFollowupSend.disabled = false;
                readingBox.scrollTop = readingBox.scrollHeight;
            }
        }

        btnFollowupSend.addEventListener("click", sendFollowupQuestion);
        followupInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendFollowupQuestion();
        });

        function shuffleDeck() {
            if (isProcessing || btnShuffle.disabled) return;
            
            const spreadHTML = SPREAD_DESCRIPTIONS[spreadSelect.value] || "<strong>✨ Sẵn sàng kết nối</strong><br><em>Đang đồng bộ năng lượng...</em><br>Vui lòng chờ đợi.";

            board.innerHTML = `
                <div class="info-card-wrap animate__animated animate__fadeInLeft">
                    <div class="info-card-inner">
                        ${spreadHTML}
                        <br><span class="loading-dots" style="color: var(--p6); font-style: italic;">Đang đồng bộ năng lượng với các vì sao</span>
                    </div>
                </div>
            `;
            board.className = "tarot-board"; 

            hideReading();
            btnDraw.disabled = true;

            currentTarotDeck = [...tarotDeck].sort(() => Math.random() - 0.5);
            currentLenormandDeck = [...lenormandDeck].sort(() => Math.random() - 0.5);
            currentChakraDeck = [...chakraDeck].sort(() => Math.random() - 0.5);
            
            statusMsg.innerText = "Đang kết nối dòng chảy... Hãy thả lỏng tâm trí!";
            drawnCardsList = []; 
            flippedCount = 0;    
            
            setTimeout(() => {
                btnDraw.disabled = false; 
                statusMsg.innerText = "Đã đồng điệu. Hãy ấn Bốc Bài!";
                
                const loadingSpan = board.querySelector(".loading-dots");
                if(loadingSpan) loadingSpan.style.display = "none";
            }, 1000);
        }

        function drawCards() {
            if (isProcessing) return;
            
            const infoCard = board.querySelector('.info-card-wrap');
            if (infoCard) {
                infoCard.classList.remove('animate__fadeInLeft');
                void infoCard.offsetWidth; 
                infoCard.classList.add('animate__animated', 'animate__hinge');
                
                setTimeout(() => {
                    executeDrawSequence();
                }, 2000);
            } else {
                executeDrawSequence();
            }
        }

        function executeDrawSequence() {
            board.innerHTML = ""; 
            hideReading();
            drawnCardsList = [];
            flippedCount = 0;
            
            const spreadMode = spreadSelect.value; 
            board.className = `tarot-board ${spreadMode}`;
            
            let setupPlan = []; 

            const tarotPop = () => ({ type: 'tarot', name: currentTarotDeck.pop(), reversed: (Math.random() * 100) < REVERSAL_THRESHOLD });
            const lenormandPop = () => ({ type: 'lenormand', name: currentLenormandDeck.pop(), reversed: false });
            const chakraPop = () => ({ type: 'chakra', name: currentChakraDeck.pop(), reversed: false });

            if (spreadMode === "intent_what") { setupPlan.push(tarotPop()); }
            else if (spreadMode === "intent_why") { setupPlan.push(tarotPop(), tarotPop(), tarotPop()); }
            else if (spreadMode === "intent_when") { setupPlan.push(lenormandPop(), lenormandPop(), lenormandPop()); }
            else if (spreadMode === "intent_all") { setupPlan.push(tarotPop(), tarotPop(), tarotPop(), lenormandPop(), lenormandPop()); }
            else if (spreadMode === "intent_mbs") { setupPlan.push(chakraPop(), tarotPop(), lenormandPop()); }
            else if (spreadMode === "intent_healing") { setupPlan.push(chakraPop(), tarotPop(), lenormandPop(), lenormandPop()); }
            else if (spreadMode === "intent_crossroads") { setupPlan.push(tarotPop(), tarotPop(), tarotPop()); }
            else if (spreadMode === "intent_flow") { setupPlan.push(lenormandPop(), lenormandPop(), lenormandPop(), lenormandPop(), lenormandPop()); }
            else if (spreadMode === "intent_relationship") { setupPlan.push(tarotPop(), tarotPop(), lenormandPop(), lenormandPop(), chakraPop()); }
            else if (spreadMode === "intent_dream") { setupPlan.push(chakraPop(), tarotPop(), lenormandPop()); }
            else if (spreadMode === "intent_mirror") { setupPlan.push(tarotPop(), tarotPop(), tarotPop(), tarotPop(), tarotPop()); }
            else if (spreadMode === "classic_croix") { setupPlan.push(tarotPop(), tarotPop(), tarotPop(), tarotPop(), tarotPop()); }
            else if (spreadMode === "classic_ligne") { setupPlan.push(tarotPop(), tarotPop(), tarotPop()); }
            else if (spreadMode === "classic_grand_ourse") { for(let i=0; i<7; i++) setupPlan.push(tarotPop()); }
            else if (spreadMode === "classic_astrologique") { for(let i=0; i<12; i++) setupPlan.push(tarotPop()); }
            else if (spreadMode === "classic_celtique") { for(let i=0; i<10; i++) setupPlan.push(tarotPop()); }
            else if (spreadMode === "mystic_tree") { for(let i=0; i<10; i++) setupPlan.push(tarotPop()); }
            else if (spreadMode === "mystic_shadow") { for(let i=0; i<5; i++) setupPlan.push(tarotPop()); }
            else if (spreadMode === "mystic_johari") { for(let i=0; i<4; i++) setupPlan.push(tarotPop()); }
            else if (spreadMode === "mystic_karmic") { for(let i=0; i<5; i++) setupPlan.push(tarotPop()); }

            drawnCardsList = setupPlan;
            totalCardsToDraw = setupPlan.length;
            statusMsg.innerText = `Hãy lật mở ${totalCardsToDraw} lá bài...`;
            btnDraw.disabled = true; 

            setupPlan.forEach((cardObj, index) => {
                const cardSlot = document.createElement("div");
                
                cardSlot.className = "card-slot animate__animated animate__rollIn";
                cardSlot.style.animationDelay = `${index * 0.2}s`; 
                
                let backImg = backTarot, frontImg = '';
                if (cardObj.type === 'tarot') { backImg = backTarot; frontImg = `${pathTarot}${cardObj.name}.PNG`; }
                else if (cardObj.type === 'lenormand') { backImg = backLenormand; frontImg = `${pathLenormand}${cardObj.name}.PNG`; }
                else if (cardObj.type === 'chakra') { backImg = backChakra; frontImg = `${pathChakra}${cardObj.name}.PNG`; }
                
                let labelText = "Thấu Thị";
                if (spreadMode === "intent_why") { labelText = ["Quá Khứ", "Hiện Tại", "Tương Lai"][index]; }
                else if (spreadMode === "intent_when") { labelText = `Sự Kiện ${index + 1}`; }
                else if (spreadMode === "intent_all") { labelText = ["WHAT", "WHY", "HOW", "WHEN", "WHO"][index]; }
                else if (spreadMode === "intent_mbs") { labelText = ["Luân Xa", "Tâm Trí", "Hành Động"][index]; }
                else if (spreadMode === "intent_healing") { labelText = ["Vết Thương", "Nguyên Nhân", "Giải Pháp", "Bổ Trợ"][index]; }
                else if (spreadMode === "intent_crossroads") { labelText = ["Hướng A", "Hướng B", "Lời Khuyên"][index]; }
                else if (spreadMode === "intent_flow") { labelText = ["QK Xa", "QK Gần", "Trọng Tâm", "Tương Lai", "Kết Quả"][index]; }
                else if (spreadMode === "intent_relationship") { labelText = ["Bạn", "Người Ấy", "Sự Kiện 1", "Sự Kiện 2", "Bài Học"][index]; }
                else if (spreadMode === "intent_dream") { labelText = ["Tiềm Thức", "Higher Self", "Dấu Hiệu"][index]; }
                else if (spreadMode === "intent_mirror") { labelText = ["Bản Ngã", "Tầm Nhìn", "Vị Thế", "Công Chúng", "Sự Thật"][index]; }
                else if (spreadMode === "classic_croix") { labelText = ["Pour", "Contre", "État", "Résultats", "Synthèse"][index]; }
                else if (spreadMode === "classic_ligne") { labelText = ["Khởi Điểm", "Điểm Nút", "Phát Triển"][index]; }
                else if (spreadMode === "classic_grand_ourse") { labelText = `Bắc Đẩu ${index + 1}`; }
                else if (spreadMode === "classic_astrologique") { labelText = `Nhà ${index + 1}`; }
                else if (spreadMode === "classic_celtique") { labelText = ["Hiện tại", "Thách thức", "Ý thức", "Tiềm thức", "Quá khứ", "Tương lai", "Vị thế", "Môi trường", "Hy vọng", "Kết quả"][index]; }
                else if (spreadMode === "mystic_tree") { labelText = ["Kether (Vương Miện)", "Chokhmah (Trí Tuệ)", "Binah (Thấu Hiểu)", "Chesed (Trắc Ẩn)", "Gevurah (Sức Mạnh)", "Tiferet (Sắc Đẹp)", "Netzach (Chiến Thắng)", "Hod (Vinh Quang)", "Yesod (Nền Tảng)", "Malkuth (Vương Quốc)"][index]; }
                else if (spreadMode === "mystic_shadow") { labelText = ["Mặt Nạ", "Góc Tối", "Tổn Thương", "Bài Học", "Tích Hợp"][index]; }
                else if (spreadMode === "mystic_johari") { labelText = ["Vùng Mở", "Vùng Mù", "Vùng Ẩn", "Vùng Đóng"][index]; }
                else if (spreadMode === "mystic_karmic") { labelText = ["Tiền Kiếp", "Nợ Nghiệp", "Khế Ước", "Bài Học", "Giải Phóng"][index]; }

                cardSlot.innerHTML = `
                    <div class="card-label">${labelText}</div>
                    <div class="card-inner">
                        <div class="card-front"><img src="${backImg}" alt="Mặt sau" onerror="this.src='${backTarot}'"></div>
                        <div class="card-back"><img src="${frontImg}" alt="${cardObj.name}" class="${cardObj.reversed ? 'card-reversed' : ''}"></div>
                    </div>
                `;

                cardSlot.addEventListener("click", function() {
                    if (isProcessing) return;
                    if (!this.classList.contains("flipped")) {
                        this.classList.add("flipped");
                        flippedCount++; 
                        if (flippedCount === totalCardsToDraw) {
                            statusMsg.innerText = "🔮 Đang giải mã...🔮";
                            getFullTarotReading(); 
                        } else {
                            statusMsg.innerText = `Còn ${totalCardsToDraw - flippedCount} lá nữa!`;
                        }
                    }
                });
                board.appendChild(cardSlot);
            });
        }

        btnShuffle.addEventListener("click", shuffleDeck);
        btnDraw.addEventListener("click", drawCards);

        updateSpreadOptions();
    </script>
</body>
</html>
